<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Paint</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="m3">
  <div class="bar">
    <button id="m3x">關閉</button>
    <span class="sep"></span>
    <button id="m3mode" class="on">模式：畫圖</button>
    <span class="sep"></span>
    <label>厚度 <input id="depth" type="range" min="2" max="300" value="30"></label>
    <label>層距 <input id="gap" type="range" min="0" max="300" value="60"></label>
    <label>精細度 <select id="res"><option value="12">低</option><option value="8" selected>中</option><option value="5">高</option></select></label>
    <span class="sep"></span>
    <button id="m3spring">自動回正</button><button id="m3home">回正</button><button id="m3lv">鎖定俯仰</button><button id="m3lh">鎖定水平</button>
    <span class="sep"></span>
    <button id="m3man" class="on">人偶</button><span id="poses"></span><button id="m3reset">重置姿勢</button>
    <label>人偶大小 <input id="msize" type="range" min="30" max="150" value="100"></label>
    <span class="sep"></span>
    <button id="m3save">存成輔助線圖層</button>
  </div>
  <div id="m3c"></div>
</div>
<header id="topbar">
  <button id="popen" title="開啟先前存的 .lpaint 專案">開專案</button>
  <button id="psave" title="存成可再編輯的專案檔（保留圖層）">存專案</button>
  <label class="check" title="勾選：專案會附上匯入時的原始圖檔，之後可以無損地重複變形底圖，檔案較大">
    <input id="praw" type="checkbox" checked> 含原圖</label>
  <button id="save">匯出 PNG</button>
  <button id="imp" title="匯入圖片當底圖（放在最底層之上）">匯入底圖</button>
  <input id="pfile" type="file" hidden>
  <input id="impf" type="file" accept="image/*" hidden>
  <span class="sep"></span>
  <label>版面 <select id="vsize" aria-label="版面尺寸"></select></label>
  <button id="vori" title="切換直式／橫式">直式</button>
  <span class="spacer"></span>
  <div class="seg">
    <button id="brush" class="on">筆刷</button><button id="eraser">橡皮擦</button><button id="tfm">變形</button><button id="pick">滴管</button>
  </div>
  <button id="undo" class="icon" title="復原（兩指輕點）" aria-label="復原">↶</button><button id="redo" class="icon" title="重做（三指輕點）" aria-label="重做">↷</button>
  <span class="sep"></span>
  <div class="seg" id="viewseg">
    <button id="vfit" class="on" title="整體視角（適合畫面）">整體</button><button id="vdetail" title="局部視角（100% 原寸）">局部</button>
  </div>
  <div class="zoombox">
    <button id="zout" class="icon" title="縮小 (Ctrl −)">−</button>
    <select id="zsel" title="顯示比例" aria-label="顯示比例"></select>
    <button id="zin" class="icon" title="放大 (Ctrl +)">+</button>
  </div>
  <span class="sep"></span>
  <button id="d3">3D 檢視</button>
  <span class="spacer"></span>
  <button id="uitog" aria-label="收合面板"></button>
</header>
<div id="eraser-toast" class="eraser-toast" style="display:none">
  <div class="et-inner">
    <span class="et-icon">⌫</span>
    <span id="et-text">1.0 秒後切換回筆刷</span>
    <button id="et-keep" type="button" title="保持橡皮擦模式">保持</button>
    <button id="et-now" type="button" title="立即切換回筆刷">立即切換 ✎</button>
  </div>
  <div class="et-track"><div id="et-progress" class="et-progress"></div></div>
</div>
<div id="stage">
  <div id="wrap"></div>
  <div id="ipad-quick-bar" class="ipad-quick-bar" title="iPad 快速滑桿">
    <div class="iq-slider" id="iq-size-wrap" title="上下拖曳調整筆刷大小">
      <div class="iq-track"><div id="iq-size-fill" class="iq-fill"></div><div id="iq-size-thumb" class="iq-thumb"></div></div>
      <span class="iq-badge" id="iq-size-badge">8</span>
    </div>
    <button id="iq-btn-tool" class="iq-btn" type="button" title="點擊切換筆刷／橡皮擦，長按可臨時擦除">✎</button>
    <div class="iq-slider" id="iq-alpha-wrap" title="上下拖曳調整不透明度">
      <div class="iq-track"><div id="iq-alpha-fill" class="iq-fill"></div><div id="iq-alpha-thumb" class="iq-thumb"></div></div>
      <span class="iq-badge" id="iq-alpha-badge">100%</span>
    </div>
  </div>
</div>
<div id="minimap" title="導航小地圖">
  <div class="mm-header">
    <span>導航小地圖</span>
    <button id="mmtog" title="收合小地圖" aria-label="收合小地圖">▾</button>
  </div>
  <div id="mmbody">
    <div id="mmbox">
      <canvas id="mmcv"></canvas>
      <canvas id="mmview"></canvas>
    </div>
    <div class="mm-footer">
      <span id="mmzoom">100%</span>
      <button id="mmfit" title="整體視野">全貌</button>
    </div>
  </div>
</div>
<div id="tfbar" style="display:none;flex-direction:column;gap:8px">
  <label>縮放 <input id="tfs" type="range" min="5" max="400" value="100"></label>
  <label>旋轉 <input id="tfr" type="range" min="-180" max="180" value="0"></label>
  <div class="row"><button id="tfflip">水平翻轉</button><button id="tfreset">重置</button><button id="tfok" class="on">完成</button></div>
  <span class="hint">拖曳移動，兩指捏合可縮放與旋轉</span>
</div>
<aside>
  <section class="grp" id="sec-tool">
    <div class="tool-title-row">
      <h2 id="tool-title">筆刷設定</h2>
      <span id="tool-badge" class="tool-badge">筆刷</span>
    </div>
    <div id="eraser-banner" class="eraser-banner" style="display:none">
      <div class="eb-top">
        <div class="eb-msg">
          <span class="eb-dot"></span>
          <span>橡皮擦模式中</span>
        </div>
        <button id="btn-to-brush" class="btn-to-brush" type="button" title="切換回筆刷 (快捷鍵 B)">切換回筆刷 ✎</button>
      </div>
      <div class="eraser-timer-row">
        <span class="et-label">擦完自動切回筆刷</span>
        <div class="seg timer-seg" id="eraser-delay-seg">
          <button data-delay="500" type="button" title="擦完 0.5 秒後切換">0.5秒</button>
          <button data-delay="1000" type="button" title="擦完 1 秒後切換" class="on">1秒</button>
          <button data-delay="0" type="button" title="保持橡皮擦，手動切換">關閉</button>
        </div>
      </div>
    </div>
    <div class="brushline"><select id="bsel" aria-label="筆刷"></select><input id="color" type="color" value="#222222" aria-label="顏色"></div>
    <!-- 鉛筆硬度面板 -->
    <div id="sub-pencil" class="brush-subpanel">
      <div class="sub-label">鉛筆硬度</div>
      <div class="hardness-bar" id="hardness-bar"></div>
    </div>
    <!-- 鋼筆筆尖面板 -->
    <div id="sub-pen" class="brush-subpanel" style="display:none">
      <div class="sub-label">鋼筆筆尖</div>
      <div class="nib-bar" id="nib-bar"></div>
    </div>
    <!-- 水彩筆刷種類與含水量面板 -->
    <div id="sub-wc" class="brush-subpanel" style="display:none">
      <div class="sub-label">水彩筆型</div>
      <div class="wc-types-bar" id="wc-types-bar"></div>
      <label style="margin-top:6px;gap:6px">含水量 <input id="wc-wet" type="range" min="15" max="100" value="65"><span id="wc-wet-val">65%</span></label>
    </div>
    <!-- 專用多色盒面板（粉蠟筆、Marker、丙烯馬克筆、彩色鉛筆） -->
    <div id="sub-palette" class="brush-subpanel" style="display:none">
      <div class="sub-header">
        <span class="sub-label" id="palette-title">色盒</span>
        <div class="palette-tabs" id="palette-tabs"></div>
      </div>
      <div class="palette-grid" id="palette-grid"></div>
    </div>
    <label>大小 <input id="size" type="range" min="1" max="100" value="8"></label>
    <label>濃度 <input id="alpha" type="range" min="5" max="100" value="100"></label>
    <label class="check"><input id="qson" type="checkbox" checked> 停筆拉成直線</label>
    <div class="esoft-row">
      <label class="check" id="lbl-esoft" title="勾選＝沿用目前筆刷的濃度、紙紋與側鋒去擦，會有顆粒感、也會留下殘影（鉛筆稿的局部減淡很好用）；不勾＝乾淨的硬邊橡皮擦，一筆擦掉">
        <input id="esoft" type="checkbox"> 橡皮擦保留筆刷質感</label>
      <button id="btn-esoft-done" type="button" class="btn-subtle" style="display:none" title="完成設定切換回筆刷">返回筆刷</button>
    </div>
    <div class="row">
      <button id="tipimp" title="匯入一張圖當筆尖，例如 remove-bg 切出來的素材">匯入筆尖</button>
      <button id="tipclr" class="icon" aria-label="清除筆尖" title="清除筆尖" disabled>✕</button>
    </div>
    <label class="check"><input id="tipraw" type="checkbox"> 筆尖保留原色</label>
    <input id="tipf" type="file" accept="image/*" hidden>
  </section>

  <section class="grp">
    <h2>透視輔助線</h2>
    <select id="gmode" aria-label="透視輔助線">
      <option value="0">關閉</option><option value="1">1 點透視</option><option value="2">2 點透視</option><option value="3">3 點透視</option></select>
    <label>線數 <input id="gn" type="range" min="4" max="48" value="16"></label>
    <button id="gbake">存成圖層</button>
  </section>

  <section class="grp">
    <h2>圖層</h2>
    <div class="row">
      <button id="add">新增</button><button id="clr">清除</button><button id="del">刪除</button>
    </div>
    <div class="row">
      <button id="up" class="icon" aria-label="上移">▲</button><button id="down" class="icon" aria-label="下移">▼</button><button id="merge">向下合併</button>
    </div>
    <label>透明度 <input id="lalpha" type="range" min="0" max="100" value="100"></label>
    <div id="list"></div>
  </section>

  <section class="grp" id="sec-ipad">
    <h2>iPad &amp; Apple Pencil</h2>
    <label class="check" title="開啟時，單指與手掌觸控不畫圖、不平移；畫圖專屬 Apple Pencil，畫布縮放平移限雙指手勢">
      <input id="palm-reject" type="checkbox" checked> Apple Pencil 專用（防手掌誤觸）
    </label>
    <label class="check" title="Apple Pencil 懸浮（M2/M4 iPad）或滑鼠移動時，預先在畫布顯示筆刷形狀與大小">
      <input id="pencil-hover" type="checkbox" checked> 筆刷懸浮感應預覽 (Hover)
    </label>
    <label class="check" title="在畫布左側顯示 Procreate 風格的快速大小／濃度滑桿與筆刷橡皮擦切換鍵">
      <input id="quick-bar-on" type="checkbox" checked> 側邊快速快捷滑桿
    </label>
    <div style="font-size:11px;font-weight:600;color:var(--muted);margin-top:4px">壓感靈敏度</div>
    <div class="seg" id="pressure-seg" style="width:100%">
      <button data-curve="0.75" type="button" title="輕柔：輕觸即出大筆觸">輕柔</button>
      <button data-curve="1.0" type="button" class="on" title="標準：1:1 原生線性壓感">標準</button>
      <button data-curve="1.35" type="button" title="紮實：需重壓才出大筆觸">紮實</button>
    </div>
  </section>
</aside>
<script src="app.js"></script>
</body>
</html>
